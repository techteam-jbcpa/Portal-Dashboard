# .github/workflows/hubspot-sync.yml
# Polls HubSpot Expansion Pipeline tickets → upserts to Supabase
# Runs every 15 minutes (GitHub Actions free tier: ~1,440 min/month at ~30s/run)

name: HubSpot → Supabase Sync

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          HUBSPOT_TOKEN:      ${{ secrets.HUBSPOT_TOKEN }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python hubspot_sync.py
