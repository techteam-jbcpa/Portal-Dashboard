<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your LLC Formation Progress</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fb;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 24px rgba(0,0,0,0.08);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 32px;
    }

    .progress-wrap {
      background: #f3f4f6;
      border-radius: 100px;
      height: 6px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, #1d4ed8, #3b82f6);
      transition: width 0.6s ease;
    }
    .progress-label {
      font-size: 12px;
      color: #6b7280;
      text-align: right;
      margin-bottom: 32px;
    }

    .steps { display: flex; flex-direction: column; }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 14px 0;
      position: relative;
    }

    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 15px;
      top: 46px;
      bottom: -14px;
      width: 2px;
      background: #e5e7eb;
    }
    .step.done:not(:last-child)::after { background: #1d4ed8; }

    .step-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      border: 2px solid #e5e7eb;
      background: #fff;
      color: #9ca3af;
      z-index: 1;
      position: relative;
    }
    .step.done .step-icon   { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .step.active .step-icon { background: #fff; border-color: #1d4ed8; color: #1d4ed8; box-shadow: 0 0 0 4px #dbeafe; }
    .step.onhold .step-icon { background: #fff7ed; border-color: #f59e0b; color: #f59e0b; }

    .step-body { flex: 1; padding-top: 4px; }

    .step-label { font-size: 15px; font-weight: 600; color: #374151; }
    .step.done .step-label    { color: #111827; }
    .step.active .step-label  { color: #1d4ed8; }
    .step.onhold .step-label  { color: #b45309; }
    .step.pending .step-label { color: #9ca3af; }

    .step-desc { font-size: 13px; color: #9ca3af; margin-top: 2px; line-height: 1.5; }
    .step.done .step-desc,
    .step.active .step-desc { color: #6b7280; }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 100px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .badge-active { background: #dbeafe; color: #1d4ed8; }
    .badge-onhold { background: #fef3c7; color: #b45309; }
    .badge-done   { background: #d1fae5; color: #065f46; }

    .onhold-banner {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .onhold-banner .icon { font-size: 20px; flex-shrink: 0; }
    .onhold-banner strong { display: block; font-size: 14px; color: #92400e; margin-bottom: 2px; }
    .onhold-banner p { font-size: 13px; color: #a16207; line-height: 1.5; }

    .complete-banner {
      background: #ecfdf5;
      border: 1px solid #6ee7b7;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 28px;
      text-align: center;
    }
    .complete-banner .icon { font-size: 28px; margin-bottom: 8px; }
    .complete-banner strong { display: block; font-size: 16px; color: #065f46; margin-bottom: 4px; }
    .complete-banner p { font-size: 13px; color: #047857; }

    .state-msg { text-align: center; padding: 48px 0; color: #9ca3af; font-size: 15px; }
    .state-msg .icon { font-size: 32px; margin-bottom: 12px; }

    .footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #f3f4f6;
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }
    .footer a { color: #1d4ed8; text-decoration: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">James Baker &amp; Associates</div>
  <h1>Your LLC Formation Progress</h1>
  <p class="subtitle">Track every step of your business formation journey.</p>

  <div id="root">
    <div class="state-msg">
      <div class="icon">&#9203;</div>
      Loading your progress&hellip;
    </div>
  </div>

  <div class="footer">
    Questions? Contact your advisor at
    <a href="mailto:info@jamesbakercpa.com">info@jamesbakercpa.com</a>
  </div>
</div>

<script>
  var SUPABASE_URL  = 'https://rebmccnzqkhbmzvddolk.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlYm1jY256cWtoYm16dmRkb2xrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4ODE5OTksImV4cCI6MjEwMTQ1Nzk5OX0.u3eIiQ7o2U9rFO5h78aMvONn3aVyzzjlfYIuFWhyw0s';

  var STEPS = [
    { status: 'New',                         label: 'Journey Started',        desc: 'Your LLC formation has been initiated with James Baker & Associates.' },
    { status: 'Onboarding/Info Request',     label: 'Onboarding',             desc: 'We are collecting your information to prepare the filing.' },
    { status: 'Waiting for Client',          label: 'LLC Formation Filing',   desc: 'Documents are being reviewed and your LLC filing is being prepared.' },
    { status: 'Work in Process in CU',       label: 'LLC Registration',       desc: 'Your LLC is being registered with the state.' },
    { status: 'Step Two Financial Accounts', label: 'Opening Bank Accounts',  desc: 'Setting up your business banking and financial accounts.' },
    { status: 'Waiting For ITIN',            label: 'ITIN Processing',        desc: 'Your Individual Taxpayer Identification Number application is in progress.' },
    { status: 'Closed',                      label: 'Expansion Complete',     desc: 'Your LLC is fully formed and operational. Welcome!' }
  ];

  var ON_HOLD_STATUSES = ['Unresponsive', 'Delinquent/Missing Payment', 'On Hold by Client'];

  function getEmail() {
    var params = new URLSearchParams(window.location.search);
    return (params.get('email') || '').trim().toLowerCase();
  }

  function stepIconHtml(state) {
    if (state === 'done')   return '&#10003;';
    if (state === 'active') return '&#9679;';
    if (state === 'onhold') return '&#9646;&#9646;';
    return '';
  }

  function render(ticketStatus) {
    var root   = document.getElementById('root');
    var isHold = ON_HOLD_STATUSES.indexOf(ticketStatus) !== -1;
    var isDone = (ticketStatus === 'Closed');

    var activeIdx = -1;
    for (var s = 0; s < STEPS.length; s++) {
      if (STEPS[s].status === ticketStatus) { activeIdx = s; break; }
    }
    if (isHold && activeIdx < 0) activeIdx = 3; // fallback: show through LLC Registration

    var pct = isDone ? 100 : (activeIdx < 0 ? 0 : Math.round((activeIdx / (STEPS.length - 1)) * 100));

    var html = '';
    html += '<div class="progress-wrap"><div class="progress-bar" style="width:' + pct + '%"></div></div>';
    html += '<div class="progress-label">' + pct + '% complete</div>';

    if (isDone) {
      html += '<div class="complete-banner"><div class="icon">&#127881;</div>'
            + '<strong>Your Expansion is Complete!</strong>'
            + '<p>Your LLC is fully formed and ready to operate. Thank you for trusting James Baker &amp; Associates.</p>'
            + '</div>';
    } else if (isHold) {
      html += '<div class="onhold-banner"><div class="icon">&#9888;&#65039;</div>'
            + '<div><strong>Action Required</strong>'
            + '<p>Your file is currently on hold. Please contact your advisor to continue the process.</p></div>'
            + '</div>';
    }

    html += '<div class="steps">';
    for (var i = 0; i < STEPS.length; i++) {
      var step = STEPS[i];
      var state;
      if (isDone) {
        state = 'done';
      } else if (isHold) {
        state = i < activeIdx ? 'done' : i === activeIdx ? 'onhold' : 'pending';
      } else {
        state = i < activeIdx ? 'done' : i === activeIdx ? 'active' : 'pending';
      }

      var badge = '';
      if (state === 'active')  badge = '<span class="badge badge-active">In Progress</span>';
      else if (state === 'done')   badge = '<span class="badge badge-done">Complete</span>';
      else if (state === 'onhold') badge = '<span class="badge badge-onhold">On Hold</span>';

      var desc = (state !== 'pending') ? '<div class="step-desc">' + step.desc + '</div>' : '';

      html += '<div class="step ' + state + '">'
            + '<div class="step-icon">' + stepIconHtml(state) + '</div>'
            + '<div class="step-body">'
            + '<div class="step-label">' + step.label + badge + '</div>'
            + desc
            + '</div></div>';
    }
    html += '</div>';

    root.innerHTML = html;
  }

  function renderError(msg) {
    document.getElementById('root').innerHTML =
      '<div class="state-msg"><div class="icon">&#9888;&#65039;</div>' + msg + '</div>';
  }

  function main() {
    var email = getEmail();
    if (!email) {
      renderError('No client email found. Please access this page through your client portal.');
      return;
    }

    fetch(
      SUPABASE_URL + '/rest/v1/clients?contact_email=eq.' + encodeURIComponent(email) + '&select=ticket_status&limit=1',
      {
        headers: {
          'apikey':        SUPABASE_ANON,
          'Authorization': 'Bearer ' + SUPABASE_ANON
        }
      }
    )
    .then(function(resp) {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    })
    .then(function(rows) {
      if (!rows || rows.length === 0) {
        renderError('We could not find your file. Please contact your advisor.');
        return;
      }
      render(rows[0].ticket_status);
    })
    .catch(function(err) {
      console.error(err);
      renderError('Unable to load your progress. Please try again later.');
    });
  }

  main();
</script>
</body>
</html>
