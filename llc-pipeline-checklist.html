<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLC Formation Progress</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9f8f6;
      padding: 24px;
      min-height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 28px 32px;
      max-width: 540px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
    }

    /* Progress bar */
    .progress-bar-wrap {
      background: #eee;
      border-radius: 99px;
      height: 6px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #2e7d32, #66bb6a);
      transition: width 0.5s ease;
    }

    /* Steps */
    .steps { display: flex; flex-direction: column; gap: 0; }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      position: relative;
    }

    /* Connector line */
    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 15px;
      top: 32px;
      width: 2px;
      height: calc(100% - 8px);
      background: #e0e0e0;
      z-index: 0;
    }
    .step.done:not(:last-child)::after {
      background: #2e7d32;
    }

    .icon-wrap {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 1;
      border: 2px solid #e0e0e0;
      background: #fff;
      position: relative;
    }
    .step.done .icon-wrap {
      background: #2e7d32;
      border-color: #2e7d32;
    }
    .step.active .icon-wrap {
      background: #fff;
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245,158,11,0.15);
    }
    .step.pending .icon-wrap {
      background: #f5f5f5;
      border-color: #e0e0e0;
    }

    .checkmark {
      width: 14px;
      height: 14px;
      display: none;
    }
    .step.done .checkmark { display: block; filter: invert(1); }

    .step-num {
      font-size: 11px;
      font-weight: 700;
      color: #bbb;
    }
    .step.active .step-num { color: #f59e0b; }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid #f59e0b;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .step.active .spinner { display: block; }
    .step.active .step-num { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .step-body {
      padding: 6px 0 24px 0;
    }
    .step-label {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      line-height: 1.3;
    }
    .step.done .step-label { color: #555; }
    .step.pending .step-label { color: #aaa; }
    .step-desc {
      font-size: 12px;
      color: #aaa;
      margin-top: 3px;
      line-height: 1.4;
    }
    .step.active .step-desc { color: #888; }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 2px 8px;
      border-radius: 99px;
      margin-top: 6px;
    }
    .badge-done { background: #e8f5e9; color: #2e7d32; }
    .badge-active { background: #fff8e1; color: #b45309; }
    .badge-pending { background: #f5f5f5; color: #bbb; }
  </style>
</head>
<body>

<div class="card">
  <h2>LLC Formation Progress</h2>
  <p class="subtitle" id="subtitle">Tracking your company setup</p>

  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
  </div>

  <div class="steps" id="stepsContainer"></div>
</div>

<script>
  // ─── STAGES ────────────────────────────────────────────────
  // IDs match HubSpot Stage IDs — Pabbly passes ?stage=<hubspot_stage_id>
  const STAGES = [
    {
      id: "1409895567",
      label: "Onboarding",
      desc: "Welcome! We're getting your account ready."
    },
    {
      id: "1409895561",
      label: "Account Setup",
      desc: "Your account has been created and verified."
    },
    {
      id: "1409895562",
      label: "Formation Filing",
      desc: "Articles of organization filed with the state."
    },
    {
      id: "1409895563",
      label: "LLC Registration",
      desc: "State has registered your LLC."
    },
    {
      id: "1409895564",
      label: "SS-4 Signature",
      desc: "IRS form SS-4 requires your signature."
    },
    {
      id: "1409895565",
      label: "EIN Processing",
      desc: "IRS is processing your EIN application."
    },
    {
      id: "1409895566",
      label: "EIN Approval",
      desc: "Your Employer Identification Number is ready."
    },
    {
      id: "1409895208",
      label: "LLC Completed",
      desc: "Your LLC is fully formed and active. Congratulations!"
    }
  ];

  // ─── READ CURRENT STAGE FROM URL PARAM ─────────────────────
  // Usage: embed URL as  checklist.html?stage=ss4_signature
  // Pabbly will update this param when HubSpot stage changes
  const params = new URLSearchParams(window.location.search);
  const currentStageId = params.get("stage") || STAGES[0].id;

  const currentIndex = STAGES.findIndex(s => s.id === currentStageId);
  const activeIndex = currentIndex >= 0 ? currentIndex : 0;

  // ─── PROGRESS BAR ──────────────────────────────────────────
  const pct = Math.round((activeIndex / (STAGES.length - 1)) * 100);
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("subtitle").textContent =
    `Step ${activeIndex + 1} of ${STAGES.length} · ${pct}% complete`;

  // ─── RENDER STEPS ──────────────────────────────────────────
  const container = document.getElementById("stepsContainer");

  STAGES.forEach((stage, i) => {
    const isDone = i < activeIndex;
    const isActive = i === activeIndex;
    const isPending = i > activeIndex;

    const cls = isDone ? "done" : isActive ? "active" : "pending";
    const badgeCls = isDone ? "badge-done" : isActive ? "badge-active" : "badge-pending";
    const badgeText = isDone ? "COMPLETE" : isActive ? "IN PROGRESS" : "PENDING";

    const step = document.createElement("div");
    step.className = `step ${cls}`;
    step.innerHTML = `
      <div class="icon-wrap">
        <img class="checkmark" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='20 6 9 17 4 12'/%3E%3C/svg%3E" />
        <span class="step-num">${i + 1}</span>
        <div class="spinner"></div>
      </div>
      <div class="step-body">
        <div class="step-label">${stage.label}</div>
        <div class="step-desc">${stage.desc}</div>
        <span class="badge ${badgeCls}">${badgeText}</span>
      </div>
    `;
    container.appendChild(step);
  });
</script>
</body>
</html>
